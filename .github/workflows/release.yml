name: Release rendered taxonomy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Render and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Render standalone page
        run: |
          python3 render.py \
            taxonomy.fragment.html \
            lidar-localization-taxonomy.html
          test -s lidar-localization-taxonomy.html

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            'lidar-localization-taxonomy.html#Standalone interactive taxonomy' \
            --verify-tag \
            --generate-notes
